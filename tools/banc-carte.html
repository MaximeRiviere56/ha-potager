<meta charset="utf-8">
<title>Banc d'essai — carte Lovelace</title>
<style>
  body{margin:0;padding:24px;background:#f5f5f5;font-family:system-ui;
       --card-background-color:#fff;--primary-text-color:#212121;--secondary-text-color:#727272;
       --primary-color:#03a9f4;--divider-color:#e0e0e0;--error-color:#db4437;
       --text-primary-color:#fff;--ha-card-border-radius:12px;--warning-color:#ef6c00}
  .colonne{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
</style>
<div class="colonne"><div id="avec"></div><div id="sans"></div></div>
<script>
  // Doublures des elements de Home Assistant absents hors instance.
  customElements.define("ha-card", class extends HTMLElement {
    connectedCallback(){
      const titre = this.getAttribute("header");
      this.style.cssText = "display:block;background:var(--card-background-color);"
        + "border-radius:var(--ha-card-border-radius);box-shadow:0 1px 3px rgba(0,0,0,.12)";
      if (titre && !this.querySelector(".entete")) {
        const h = document.createElement("div");
        h.className = "entete";
        h.style.cssText = "padding:14px 16px;font-size:20px;font-weight:400";
        h.textContent = titre;
        this.prepend(h);
      }
    }
  });
  window.__erreurs = [];
  addEventListener("error", (e) => window.__erreurs.push(`${e.message} @ ${e.filename}:${e.lineno}`));
</script>
<script src="./fixture.js"></script>
<script type="module">
  import "../custom_components/potager/frontend/potager-card.js";

  // Le capteur tel que l'expose sensor.py, reconstitue depuis la fixture.
  const jardin = await window.__hassFactice.callWS({ type: "potager/jardin" });
  const etat = {
    state: String(jardin.actions.length),
    attributes: {
      friendly_name: "Mon Potager Actions à mener",
      actions: jardin.actions.map((a) => ({
        uid: a.uid, plante: a.nom, emoji: a.emoji, action: a.etape.libelle,
        etape: a.etape.type, zone: a.zone, debut: a.etape.debut, fin: a.etape.fin,
        jours_restants: a.jours_restants, en_cours: a.en_cours,
      })),
      nb_plantes: jardin.plantes.length,
    },
  };

  const hass = (actions) => ({
    states: { "sensor.mon_potager_actions_a_mener": actions ? etat
      : { ...etat, state: "0", attributes: { ...etat.attributes, actions: [] } } },
    callWS: async (msg) => { console.log("callWS", JSON.stringify(msg)); return {}; },
  });

  for (const [id, avecActions] of [["avec", true], ["sans", false]]) {
    const carte = document.createElement("potager-card");
    carte.setConfig({ titre: avecActions ? "Au potager" : "Potager (vide)" });
    document.getElementById(id).appendChild(carte);
    carte.hass = hass(avecActions);
  }
  console.log("BANC CARTE: monte");
</script>
