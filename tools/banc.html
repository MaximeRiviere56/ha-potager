<meta charset="utf-8">
<title>Banc d'essai — panneau Rhizome</title>
<!--
  Monte le panneau hors de Home Assistant, avec un `hass` factice dont les
  reponses sont generees par tools/banc_fixture.py depuis le vrai catalogue et
  le vrai moteur. Permet de verifier les cinq vues sans instance.

  Usage : python3 tools/banc_fixture.py && python3 -m http.server 8777
          puis ouvrir http://localhost:8777/tools/banc.html
-->
<style>
  html,body{margin:0;height:100%;font-family:system-ui}
  body{--primary-background-color:#f5f5f5;--card-background-color:#fff;--primary-text-color:#212121;
       --secondary-text-color:#727272;--primary-color:#03a9f4;--divider-color:#e0e0e0;
       --error-color:#db4437;--text-primary-color:#fff;--app-header-background-color:#03a9f4;
       --app-header-text-color:#fff;--header-height:56px;--ha-card-border-radius:12px}
  #hote,rhizome-panel{height:100%}
</style>
<div id="hote"></div>
<script>
  // `ha-icon` n'existe pas hors de Home Assistant : un carre vide suffit a
  // verifier que le panneau ne s'y casse pas.
  customElements.define("ha-icon", class extends HTMLElement {
    connectedCallback(){ this.style.cssText = "display:inline-block;width:20px;height:20px"; }
  });
  window.__erreurs = [];
  addEventListener("error", (e) => window.__erreurs.push(`${e.message} @ ${e.filename}:${e.lineno}`));
  addEventListener("unhandledrejection", (e) => window.__erreurs.push(`promesse rejetee : ${e.reason}`));
</script>
<script src="./fixture.js"></script>
<script type="module">
  import "../custom_components/rhizome/frontend/rhizome-panel.js";
  const panneau = document.createElement("rhizome-panel");
  document.getElementById("hote").appendChild(panneau);
  panneau.hass = window.__hassFactice;
  window.__panneau = panneau;
  // Expose un selecteur d'onglet, pour piloter le banc depuis la console.
  window.__onglet = (id) =>
    panneau.shadowRoot.querySelector(`nav button[data-vue="${id}"]`).click();
  console.log("BANC: panneau monte");
</script>
