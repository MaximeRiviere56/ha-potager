<meta charset="utf-8">
<title>Banc d'essai — panneau Mon Potager</title>
<style>
  html,body{margin:0;height:100%;font-family:system-ui}
  body{--primary-background-color:#f5f5f5;--card-background-color:#fff;--primary-text-color:#212121;
       --secondary-text-color:#727272;--primary-color:#03a9f4;--divider-color:#e0e0e0;
       --error-color:#db4437;--text-primary-color:#fff;--app-header-background-color:#03a9f4;
       --app-header-text-color:#fff;--header-height:56px;--ha-card-border-radius:12px}
  #hote{height:100%}
  potager-panel{height:100%}
</style>
<div id="hote"></div>
<script>
  // ha-icon n'existe pas hors de Home Assistant : on le remplace par un carre
  // vide, ce qui suffit a verifier que le panneau ne s'y casse pas.
  class HaIcon extends HTMLElement {
    connectedCallback(){ this.style.cssText="display:inline-block;width:20px;height:20px"; }
  }
  customElements.define("ha-icon", HaIcon);

  window.__erreurs = [];
  window.addEventListener("error", (e) => window.__erreurs.push(`${e.message} @ ${e.filename}:${e.lineno}`));
  window.addEventListener("unhandledrejection", (e) => window.__erreurs.push(`promesse rejetee : ${e.reason}`));
</script>
<script src="/fixture.js"></script>
<script type="module">
  import "/custom_components/potager/frontend/potager-panel.js";

  const panneau = document.createElement("potager-panel");
  document.getElementById("hote").appendChild(panneau);
  panneau.hass = window.__hassFactice;
  window.__panneau = panneau;
  console.log("BANC: panneau monte");
</script>
